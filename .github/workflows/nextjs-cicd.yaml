name: Next.js CI/CD Pipeline

on:
  push:
    branches:
      - feature/cicd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_S3_URL: ${{ secrets.NEXT_PUBLIC_S3_URL }}
          NODE_ENV: 'production'
          AUTH_SERVER_URL: ${{ secrets.AUTH_SERVER_URL }}
          MEMBERS_SERVER_URL: ${{ secrets.MEMBERS_SERVER_URL }}
          RESUMES_SERVER_URL: ${{ secrets.RESUMES_SERVER_URL }}
          NOTIFICATIONS_SERVER_URL: ${{ secrets.NOTIFICATIONS_SERVER_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: aida0/gitfolio_front:dev
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_S3_URL=${{ secrets.NEXT_PUBLIC_S3_URL }}
            NODE_ENV=production
            AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}
            MEMBERS_SERVER_URL=${{ secrets.MEMBERS_SERVER_URL }}
            RESUMES_SERVER_URL=${{ secrets.RESUMES_SERVER_URL }}
            NOTIFICATIONS_SERVER_URL=${{ secrets.NOTIFICATIONS_SERVER_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get Instance ID
        id: get-instance-id
        run: |
          INSTANCE_ID="i-0c29bfed98d88f250" 
          echo "Targeting EC2 instance: $INSTANCE_ID" 
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Test SSM Connection
        run: |
          echo "Attempting to connect to instance ${{ steps.get-instance-id.outputs.instance_id }}"
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${{ steps.get-instance-id.outputs.instance_id }}" --output json
          echo "SSM Status Check completed"

      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Install expect
        run: sudo apt-get install -y expect

      - name: Deploy using SSM Session
        run: |
          echo "Starting deployment to instance ${{ steps.get-instance-id.outputs.instance_id }}"
          unbuffer aws ssm start-session \
            --target "${{ steps.get-instance-id.outputs.instance_id }}" \
            --document-name AWS-StartInteractiveCommand \
            --parameters command="echo 'Successfully connected to instance' && \
              sudo -i && \
              echo 'Switched to root user' && \
              docker pull aida0/gitfolio_front:dev && \
              echo 'Pulled latest image' && \
              docker stop gitfolio_front || true && \
              docker rm gitfolio_front || true && \
              echo 'Removed old container' && \
              docker run -d \
                --name gitfolio_front \
                -p 80:3000 \
                -p 443:3000 \
                -p 5000:3000 \
                -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
                -e NEXT_PUBLIC_S3_URL=${{ secrets.NEXT_PUBLIC_S3_URL }} \
                -e NODE_ENV=production \
                -e AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }} \
                -e MEMBERS_SERVER_URL=${{ secrets.MEMBERS_SERVER_URL }} \
                -e RESUMES_SERVER_URL=${{ secrets.RESUMES_SERVER_URL }} \
                -e NOTIFICATIONS_SERVER_URL=${{ secrets.NOTIFICATIONS_SERVER_URL }} \
                aida0/gitfolio_front:dev && \
              echo 'Deployment completed successfully'"