name: Next.js CI/CD Pipeline

on:
  push:
    branches:
      - feature/cicd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_S3_URL: ${{ secrets.NEXT_PUBLIC_S3_URL }}
          NODE_ENV: 'production'
          AUTH_SERVER_URL: ${{ secrets.AUTH_SERVER_URL }}
          MEMBERS_SERVER_URL: ${{ secrets.MEMBERS_SERVER_URL }}
          RESUMES_SERVER_URL: ${{ secrets.RESUMES_SERVER_URL }}
          NOTIFICATIONS_SERVER_URL: ${{ secrets.NOTIFICATIONS_SERVER_URL }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: aida0/gitfolio_front:test
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_S3_URL=${{ secrets.NEXT_PUBLIC_S3_URL }}
            NODE_ENV=production
            AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}
            MEMBERS_SERVER_URL=${{ secrets.MEMBERS_SERVER_URL }}
            RESUMES_SERVER_URL=${{ secrets.RESUMES_SERVER_URL }}
            NOTIFICATIONS_SERVER_URL=${{ secrets.NOTIFICATIONS_SERVER_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get Instance ID
        id: get-instance-id
        run: |
          INSTANCE_ID=$(aws ssm describe-instance-information \
            --output json \
            --query "InstanceInformationList[*].InstanceId" | \
          jq -r '.[]' | \
          xargs -I {} aws ec2 describe-instances \
            --instance-ids {} \
            --query "Reservations[*].Instances[*].{InstanceId:InstanceId}[?Tags[?Key=='Name' && Value=='Gitfolio Frontend']]" \
            --output json | \
          jq -r '.[0][0].InstanceId')
          
          if [ -z "$INSTANCE_ID" ]; then
            echo "Error: No instance found with the specified tags"
            exit 1
          fi
          
          echo "Found EC2 instance: $INSTANCE_ID"
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Test SSM Connection
        run: |
          echo "Attempting to connect to instance ${{ steps.get-instance-id.outputs.instance_id }}"
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${{ steps.get-instance-id.outputs.instance_id }}" --output json
          echo "SSM Status Check completed"

      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Create deployment script
        run: |
          cat << 'EOF' > deploy.sh
          #!/bin/bash
          cd /home/ec2-user
          
          # Create .env file with GitHub Secrets
          cat << 'ENVEOF' > .env
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_S3_URL=${{ secrets.NEXT_PUBLIC_S3_URL }}
          AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}
          MEMBERS_SERVER_URL=${{ secrets.MEMBERS_SERVER_URL }}
          RESUMES_SERVER_URL=${{ secrets.RESUMES_SERVER_URL }}
          NOTIFICATIONS_SERVER_URL=${{ secrets.NOTIFICATIONS_SERVER_URL }}
          ENVEOF
          
          # Pull latest images
          docker-compose pull
          
          # Stop and remove existing containers, volumes, and images
          docker-compose down -v --rmi all
          
          # Pull images again
          docker-compose pull
          
          # Start containers in detached mode
          docker-compose up -d
          
          # Show running containers
          docker ps -a
          EOF
          chmod +x deploy.sh

          - name: Deploy to EC2
            run: |
              # Send the script to the instance and execute it
              aws ssm send-command \
                --instance-ids "${{ steps.get-instance-id.outputs.instance_id }}" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[`cat deploy.sh`]" \
                --output text

