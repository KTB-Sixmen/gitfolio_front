  deploy:
#    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Get Instance ID
        id: get-instance-id
        run: |
          INSTANCE_ID=i-0c29bfed98d88f250 
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Test SSM Connection
        run: |
          echo "Attempting to connect to instance ${{ steps.get-instance-id.outputs.instance_id }}"
          aws ssm describe-instance-information --filters "Key=InstanceIds,Values=${{ steps.get-instance-id.outputs.instance_id }}" --output json
          echo "SSM Status Check completed"

      - name: Install Session Manager Plugin
        run: |
          curl "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb" -o "session-manager-plugin.deb"
          sudo dpkg -i session-manager-plugin.deb

      - name: Create deployment script
        run: |
          cat > deploy.sh << 'EOF'
          #!/bin/bash
          cd /home/ec2-user
          
          cat << 'ENVEOF' > .env
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_S3_URL=${{ secrets.NEXT_PUBLIC_S3_URL }}
          AUTH_SERVER_URL=${{ secrets.AUTH_SERVER_URL }}
          MEMBERS_SERVER_URL=${{ secrets.MEMBERS_SERVER_URL }}
          RESUMES_SERVER_URL=${{ secrets.RESUMES_SERVER_URL }}
          NOTIFICATIONS_SERVER_URL=${{ secrets.NOTIFICATIONS_SERVER_URL }}
          ENVEOF
          
          docker-compose pull
          
          docker-compose down -v --rmi all
          
          docker-compose pull
          
          docker-compose up -d
          
          docker ps -a
          EOF
          chmod +x deploy.sh

      - name: Deploy to EC2
        run: |              
          aws ssm send-command \
            --instance-ids "${{ steps.get-instance-id.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[`cat deploy.sh`]" \
            --output text

